configuration:
  mode:
    name: Mode
    description: >-
      "local" runs MyBabyNotes on this Home Assistant box (data in the add-on's
      /data, included in HA backups). "remote" shows an existing MyBabyNotes
      instance in the sidebar instead.
  remote_url:
    name: Remote instance URL
    description: >-
      Remote mode only — the base URL of your existing instance, e.g.
      http://192.168.1.10:3500 (must run MyBabyNotes v1.0.0+).
network:
  80/tcp: Direct LAN port (optional) — enables the installable phone app + push
