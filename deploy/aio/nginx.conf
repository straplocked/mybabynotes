# All-in-one variant of the root nginx.conf: same server block, but the API
# and Reverb live in this container, so proxy targets are loopback instead of
# the compose service names. Keep the two files in sync when editing either.
#
# NOTE: behind a reverse proxy / CDN these zones key on the proxy's address
# (instance-wide caps) unless TRUSTED_PROXIES names it — then real-ip.sh
# generates a realip block at boot and they key on the actual client.
limit_req_zone $binary_remote_addr zone=babylog_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=babylog_ws:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # the sha256 is the pre-paint dark-check <script> in index.html (Vite copies
    # it byte-for-byte); src/test/csp.test.js recomputes it and pins this line in
    # both nginx files. Google Fonts are the only third-party origins allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
    client_max_body_size 1m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverb websocket (Pusher protocol)
    location /app {
        limit_conn babylog_ws 40;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Laravel API — straight to php-fpm in this container. SCRIPT_NAME is
    # pinned so Symfony resolves the base path as / (not /api).
    #
    # X-Forwarded-For is rewritten here, not passed through: nginx forwards
    # every request header to php-fpm as HTTP_* by default, and Laravel
    # (trustProxies '*') takes its client IP from the LEFTMOST X-Forwarded-For
    # value — so a client sending a fresh header per request would mint itself
    # a fresh login/register throttle bucket each time. An explicit
    # fastcgi_param with the header's name replaces the client's copy, and
    # $remote_addr is the right value in both modes: the direct peer by
    # default, or the true client once TRUSTED_PROXIES has real-ip.sh trust
    # the upstream proxy's chain. Same for the scheme: Laravel builds absolute
    # URLs from APP_URL, so nothing downstream reads the proto, and the root
    # nginx.conf already pins it to $scheme.
    location /api {
        limit_req zone=babylog_api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # MCP server (Streamable HTTP) — same php-fpm as /api, same forwarded-for
    # rewrite (the v1 limiter keys guests on ip()). Buffering off so
    # SSE-framed responses stream instead of stalling in nginx.
    location = /mcp {
        limit_req zone=babylog_api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # hashed build assets can cache forever
    location /assets/ {
        # a location-level add_header REPLACES the server-level set, so the
        # security headers are repeated here or these responses lose them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the service worker must always revalidate
    location = /sw.js {
        # same add_header inheritance rule as /assets/ above
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache";
    }
}
