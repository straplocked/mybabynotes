# Process supervision for the all-in-one container. Five flat processes, no
# ordering dependencies (the API's broadcasts to Reverb are best-effort, and
# nginx returns 502s until its upstreams are up — clients just retry/poll).
#
# Privilege: supervisord itself and nginx (port 80) are the only things that
# stay root. php-fpm drops to www-data through its pool config, and the three
# artisan programs drop through `user=` below — they bind nothing privileged
# (Reverb listens on 127.0.0.1:8080) and only write what the entrypoint has
# already chowned to www-data (/data, storage/, bootstrap/cache). HOME is set
# because `user=` switches the uid without touching the environment, and a
# process that inherited HOME=/root can't write there anymore.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# the API: php-fpm workers (pool tuning in api/fpm.conf → zzz-babylog.conf),
# fronted by nginx's /api fastcgi location above
[program:php-fpm]
command=php-fpm -F
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# reminder pushes (feed gap / wake window / meds) ride the scheduler;
# per-minute chatter goes to /dev/null but errors stay on stderr
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Home Assistant / MQTT command listener + availability (LWT). Idles when no
# household has MQTT configured, so it always runs.
[program:mqtt-listen]
command=php artisan mqtt:listen
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
