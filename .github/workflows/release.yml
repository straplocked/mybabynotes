# Tagged releases: pushing a v* tag runs the test suites, publishes all
# three images (app, api, aio) to GHCR as :vX.Y.Z + :latest, and creates a
# GitHub Release carrying the source tarball the Unraid installer consumes
# plus its sha256 in checksums.txt. GitHub's own /archive/ tarballs are not
# byte-stable across backend changes, so the installer verifies against this
# release-attached tarball, not GitHub's generated one.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Both drivers, same as build-images.yml — a tag can be cut from any commit,
  # so this gate can't assume the main-branch run already covered Postgres.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: babylog
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: babylog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test env
        working-directory: api
        run: cp .env.example .env && php artisan key:generate
      - name: Run API tests (${{ matrix.db }})
        working-directory: api
        env:
          BROADCAST_CONNECTION: log
          DB_CONNECTION: ${{ matrix.db }}
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'babylog_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: babylog
          DB_PASSWORD: secret
        run: php artisan test --compact

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run app tests
        run: npm test

  build:
    needs: [test, test-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # aio goes multi-arch (the HA add-on builds FROM it and HAOS boxes are
      # often aarch64); app/api stay amd64-only until someone needs otherwise
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push aio image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-aio:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mybabynotes-aio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HA add-on images: one repo per arch to match config.yaml's
  # `image: …-ha-addon-{arch}` placeholder convention (HA pulls, never builds)
  build-addon:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The add-on image tag is NOT github.ref_name, unlike every other image
      # here. Home Assistant pulls `{image}:{version}` using the version out of
      # config.yaml, which publish-addon-repo stamps with the leading v
      # STRIPPED — so tagging these `v1.0.0` published an add-on whose own
      # manifest asked for `1.0.0` and 404'd on install. The two must be
      # computed the same way; that's what this step is for.
      - name: Add-on version (the tag without its leading v)
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push add-on image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/${{ github.repository_owner }}/mybabynotes-aio:${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-ha-addon-${{ matrix.arch }}:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/mybabynotes-ha-addon-${{ matrix.arch }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stamp the add-on manifest with this version and push it to the repository
  # users add to HA. Needs the ADDONS_REPO_TOKEN secret (a fine-grained PAT
  # with contents:write on straplocked/mybabynotes-hassio-addons); the job is
  # skipped politely until that secret exists.
  publish-addon-repo:
    needs: build-addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for addons-repo token
        id: token
        # via env, not inline interpolation: the secret never lands in the
        # command line, and a token carrying a shell metacharacter can't
        # break the test
        env:
          ADDONS_REPO_TOKEN: ${{ secrets.ADDONS_REPO_TOKEN }}
        run: |
          if [ -n "$ADDONS_REPO_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ADDONS_REPO_TOKEN not set — skipping addons-repo publish"
          fi
      - name: Checkout addons repo
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mybabynotes-hassio-addons
          token: ${{ secrets.ADDONS_REPO_TOKEN }}
          path: addons-repo
      - name: Stamp and publish add-on
        if: steps.token.outputs.have == 'true'
        run: |
          mkdir -p addons-repo/mybabynotes
          cp deploy/ha-addon/repository.yaml addons-repo/repository.yaml
          cp -r deploy/ha-addon/{config.yaml,DOCS.md,README.md,CHANGELOG.md,icon.png,logo.png,translations} \
            addons-repo/mybabynotes/
          # version comes from the tag (strip the leading v)
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" addons-repo/mybabynotes/config.yaml
          cd addons-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "mybabynotes ${GITHUB_REF_NAME}"
          git push

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball + checksums
        run: |
          git archive --format=tar.gz --prefix="mybabynotes-${GITHUB_REF_NAME}/" \
            -o "mybabynotes-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "mybabynotes-${GITHUB_REF_NAME}.tar.gz" > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "mybabynotes-${GITHUB_REF_NAME}.tar.gz" checksums.txt
