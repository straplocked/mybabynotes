# Publishes app + api images to GHCR on every push to main, tagged :main +
# commit sha. :latest belongs to tagged releases (see release.yml), so
# image consumers who don't opt into tracking main never see it.
#
# Pull requests run the same two test jobs but never reach `build` — a fork's
# GITHUB_TOKEN can't push packages anyway, and an unreviewed PR must not
# publish an image. That's what makes "CI must be green before review" (see
# CONTRIBUTING.md) mean something for contributors.
name: build-images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test env
        working-directory: api
        run: cp .env.example .env && php artisan key:generate
      - name: Run API tests
        working-directory: api
        env:
          BROADCAST_CONNECTION: log
        run: php artisan test --compact
      # the committed spec must match the code — regenerate locally with the
      # container command in CLAUDE.md if this fails
      - name: OpenAPI spec is committed and current
        working-directory: api
        env:
          DB_DATABASE: /tmp/scramble.sqlite
        run: |
          touch /tmp/scramble.sqlite
          php artisan migrate --force -q
          php artisan scramble:export --path=../docs/openapi.v1.json
          git diff --exit-code -- ../docs/openapi.v1.json

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run app tests
        run: npm test

  build:
    needs: [test, test-app]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:main
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:main
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
