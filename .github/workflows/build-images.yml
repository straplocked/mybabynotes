# Publishes app + api images to GHCR on every push to main, tagged :main +
# commit sha. :latest belongs to tagged releases (see release.yml), so
# image consumers who don't opt into tracking main never see it.
#
# Pull requests run the same two test jobs but never reach `build` — a fork's
# GITHUB_TOKEN can't push packages anyway, and an unreviewed PR must not
# publish an image. That's what makes "CI must be green before review" (see
# CONTRIBUTING.md) mean something for contributors.
name: build-images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The suite runs on both supported drivers. SQLite is what the appliance
  # ships; Postgres is what a self-hoster (or the hosted tier) can point
  # DB_CONNECTION at. Running both on one codebase is the mechanism that
  # catches SQLite's loose typing, JSON column handling and boolean-cast
  # leniency before someone else's Postgres does.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]
    # started for both legs (a service can't be conditional); the sqlite leg
    # simply never connects to it
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: babylog
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: babylog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test env
        working-directory: api
        run: cp .env.example .env && php artisan key:generate
      # phpunit.xml pins sqlite/:memory:, but its <env> entries yield to a real
      # environment variable — so these select the driver without editing it
      - name: Run API tests (${{ matrix.db }})
        working-directory: api
        env:
          BROADCAST_CONNECTION: log
          DB_CONNECTION: ${{ matrix.db }}
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'babylog_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: babylog
          DB_PASSWORD: secret
        run: php artisan test --compact
      # the committed spec must match the code — regenerate locally with the
      # container command in CLAUDE.md if this fails. Driver-independent, so
      # it only needs one leg.
      - name: OpenAPI spec is committed and current
        if: matrix.db == 'sqlite'
        working-directory: api
        env:
          DB_DATABASE: /tmp/scramble.sqlite
        run: |
          touch /tmp/scramble.sqlite
          php artisan migrate --force -q
          php artisan scramble:export --path=../docs/openapi.v1.json
          git diff --exit-code -- ../docs/openapi.v1.json

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run app tests
        run: npm test

  build:
    needs: [test, test-app]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:main
            ghcr.io/${{ github.repository_owner }}/mybabynotes-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:main
            ghcr.io/${{ github.repository_owner }}/mybabynotes-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
