x-laravel-env: &laravel-env
  APP_NAME: "mybabynotes"
  APP_ENV: production
  APP_DEBUG: "false"
  # set in the git-ignored .env — generate with: echo "base64:$(openssl rand -base64 32)"
  APP_KEY: ${APP_KEY:?set APP_KEY in .env}
  APP_URL: "http://localhost:3500"
  LOG_CHANNEL: stderr
  # SQLite by default — one file in the babylog-db volume, no other service to
  # run. To use a Postgres you already have, set DB_CONNECTION=pgsql plus
  # DB_HOST/DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD (the image ships
  # pdo_pgsql); see docs/operations.md "Using Postgres instead of SQLite".
  DB_CONNECTION: ${DB_CONNECTION:-sqlite}
  DB_DATABASE: ${DB_DATABASE:-/data/database.sqlite}
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${DB_USERNAME:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  SESSION_DRIVER: cookie
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: babylog
  REVERB_APP_KEY: babylog-local-key
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET in .env}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # email (optional) — left on "log" the app degrades gracefully: invites show
  # a shareable code and "Forgot password?" says this instance can't send mail
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-null}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_SCHEME: ${MAIL_SCHEME:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}

services:
  app:
    build: .
    container_name: baby-log-app
    environment:
      # reverse-proxy IPs/CIDRs allowed to speak for clients via
      # X-Forwarded-For; empty = rate limits key on the direct peer
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "3500:80"
    depends_on:
      - api
      - reverb
    restart: unless-stopped

  api:
    build: ./api
    container_name: baby-log-api
    environment:
      <<: *laravel-env
    ports:
      # loopback only: the vite dev proxy is the sole direct caller; the LAN
      # goes through the app container on :3500
      - "127.0.0.1:3501:8000"
    volumes:
      - babylog-db:/data
    restart: unless-stopped

  reverb:
    build: ./api
    container_name: baby-log-reverb
    command: ["reverb"]
    environment:
      <<: *laravel-env
    ports:
      - "127.0.0.1:3502:8080"
    restart: unless-stopped

volumes:
  babylog-db:
