# Loopback front for php-fpm: keeps this container speaking HTTP on :8000
# like `artisan serve` did, so the app container's proxy_pass and the vite
# dev proxy need no changes. Rate limiting lives in the app container's
# nginx (this one only ever sees the app proxy or the dev proxy).
#
# X-Forwarded-For is passed through as received, on purpose: the app
# container's nginx is the one writer of that header (it overwrites whatever
# the client sent with the resolved peer address), and Laravel's per-client
# throttle keys need that value to arrive intact. This port is never the
# public edge — compose keeps :3501 off the network entirely, and the root
# docker-compose.yml binds it to 127.0.0.1 for the vite dev proxy — so the
# only callers that could author the header themselves are local processes.
server {
    listen 8000;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 1m;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        # explicit so the pass-through above is a decision, not a default
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # nothing else in public/ is executable
    location ~ \.php$ {
        return 404;
    }
}
