# NOTE: behind a reverse proxy / CDN these zones key on the proxy's address
# (instance-wide caps) unless TRUSTED_PROXIES names it — then real-ip.sh
# generates a realip block at boot and they key on the actual client.
limit_req_zone $binary_remote_addr zone=babylog_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=babylog_ws:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # the sha256 is the pre-paint dark-check <script> in index.html (Vite copies
    # it byte-for-byte); src/test/csp.test.js recomputes it and pins this line in
    # both nginx files. Google Fonts are the only third-party origins allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
    client_max_body_size 1m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverb websocket (Pusher protocol)
    location /app {
        limit_conn babylog_ws 40;
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Laravel API
    location /api {
        limit_req zone=babylog_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: after realip resolves
        # the true client this is it, and a client-forged XFF chain never
        # reaches Laravel (whose trusted-proxy handling reads leftmost)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP server (Streamable HTTP, lives in the api container). Buffering off
    # so SSE-framed responses stream instead of stalling in nginx.
    location = /mcp {
        limit_req zone=babylog_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # hashed build assets can cache forever
    location /assets/ {
        # a location-level add_header REPLACES the server-level set, so the
        # security headers are repeated here or these responses lose them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the service worker must always revalidate
    location = /sw.js {
        # same add_header inheritance rule as /assets/ above
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aHjGmzB/rhQtLxycbSO4OPienQ8jRECirOHDr8NoxjU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache";
    }
}
