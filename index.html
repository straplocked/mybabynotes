<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>mybabynotes</title>
  <meta name="description" content="Three taps from pocket to logged. Both of you, one log." />
  <!-- status-bar color. Installed Android PWAs read this at load and ignore
       later mutations, so the pre-paint script below rewrites these before
       first paint; the media split lets the OS flip it while the app is open -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF6EF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161019" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/face-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="mybabynotes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet" />
  <script>
    // pre-paint dark check so a dark-mode launch never flashes cream;
    // src/fx.js owns this decision once the app is up
    try {
      var m = (JSON.parse(localStorage.getItem('babylog:fx')) || {}).mode || 'auto'
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      // the app's own mode (manual dark, light sensor) can disagree with the
      // OS scheme — make every theme-color tag match it before the bar paints
      var metas = document.querySelectorAll('meta[name="theme-color"]')
      for (var i = 0; i < metas.length; i++) metas[i].content = dark ? '#161019' : '#FAF6EF'
    } catch (e) { /* default light */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
